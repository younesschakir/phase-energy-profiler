; =============================================================
; INA226 Current Logger — ESP8266 D1 Mini
; AMR Phase-Decomposed Energy Measurement
;
; Wiring:
;   INA226 SDA  → D2 (GPIO4)
;   INA226 SCL  → D1 (GPIO5)
;   INA226 VCC  → 3.3V
;   INA226 GND  → GND
;   INA226 VIN+ → USB VBUS (after D+/D- cut on DUT cable)
;   INA226 VIN- → DUT 5V header pin
;
;   DUT UART TX → D5 (GPIO14)   ← phase marker RX
;   Common GND between D1 Mini and DUT
;
; Shunt resistor:
;   Run A (active phases): 0.1 Ω — change SHUNT_OHMS in source
;   Run B (sleep only):    10  Ω — change SHUNT_OHMS in source
; =============================================================

[env:logger]
platform      = espressif8266
board         = d1_mini
framework     = arduino
monitor_speed = 500000
build_flags   =
    -DSHUNT_CONFIG=0    ; 0 = Run A active phases (32V/2A, 0.1 Ω shunt)
                        ; 1 = Run B sleep only   (16V/400mA, 10 Ω shunt)
lib_deps      =
    adafruit/Adafruit INA219 @ ^1.2.1
    adafruit/Adafruit BusIO @ ^1.16.1
