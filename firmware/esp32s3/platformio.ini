; =============================================================
; XIAO ESP32-S3 Sense — DUT (Device Under Test)
; AMR Phase-Decomposed Energy Measurement
;
; One environment per hardware configuration.
; Flash each separately: pio run -e c1 -t upload
;
; For measurement runs: do NOT set DEBUG_OUTPUT (USB D+/D- cut)
; For debugging: use the c1_debug environment (USB intact)
; =============================================================

[common]
monitor_filters = direct

; ─────────────────────────────────────────────────────────────
; C1 — 240 MHz, QVGA 320×240, WiFi ON (baseline)
; ─────────────────────────────────────────────────────────────
[env:c1]
platform      = espressif32
board         = seeed_xiao_esp32s3
framework     = arduino
build_flags   = -DCONFIG_ID=1
monitor_speed = 115200

; ─────────────────────────────────────────────────────────────
; c1_jomjol — C1 with the REAL jomjol dig-class100 CNN (int8) via
; esp-tflite-micro + ESP-NN, replacing the synthetic-MAC load proxy.
; Gives real Phase-5 inference energy. Flash: pio run -e c1_jomjol -t upload
; Add -DDEBUG_OUTPUT=1 to verify readings when USB is intact.
; ─────────────────────────────────────────────────────────────
[env:c1_jomjol]
platform         = espressif32@6.6.0
board            = seeed_xiao_esp32s3
framework        = arduino
monitor_speed    = 115200
build_unflags    = -std=gnu++11
build_flags      = -DCONFIG_ID=1 -DREAL_CNN
                   -std=gnu++17
                   -DESP_NN -DCONFIG_NN_OPTIMIZED -DARCH_ESP32_S3
                   -DBOARD_HAS_PSRAM
lib_deps         = nickjgniklu/ESP_TF@^2.0.1
build_src_filter = +<main.cpp>

; ─────────────────────────────────────────────────────────────
; node_a — DEPLOYABLE Platform-A node: gated ArduCAM (SPI) + jomjol CNN +
; WiFi send-reading + deep sleep. Mirror of the E5 node on the same camera.
;   pio run -e node_a -t upload         (markers -> logger)
;   pio run -e node_a_debug -t upload   (USB serial)
; ─────────────────────────────────────────────────────────────
[env:node_a]
platform         = espressif32@6.6.0
board            = seeed_xiao_esp32s3
framework        = arduino
monitor_speed    = 115200
build_unflags    = -std=gnu++11
build_flags      = -DNODE_A
                   -std=gnu++17
                   -DESP_NN -DCONFIG_NN_OPTIMIZED -DARCH_ESP32_S3
                   -DBOARD_HAS_PSRAM
lib_deps         = nickjgniklu/ESP_TF@^2.0.1
build_src_filter = +<node_a.cpp>

[env:node_a_debug]
platform         = espressif32@6.6.0
board            = seeed_xiao_esp32s3
framework        = arduino
monitor_speed    = 115200
build_unflags    = -std=gnu++11
build_flags      = -DNODE_A -DDEBUG_OUTPUT=1
                   -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
                   -std=gnu++17
                   -DESP_NN -DCONFIG_NN_OPTIMIZED -DARCH_ESP32_S3
                   -DBOARD_HAS_PSRAM
lib_deps         = nickjgniklu/ESP_TF@^2.0.1
build_src_filter = +<node_a.cpp>

; c1_jomjol_debug — same, with USB-serial debug output to verify the model
; loads and produces a reading (USB intact). Flash: pio run -e c1_jomjol_debug -t upload
[env:c1_jomjol_debug]
platform         = espressif32@6.6.0
board            = seeed_xiao_esp32s3
framework        = arduino
monitor_speed    = 115200
build_unflags    = -std=gnu++11
build_flags      = -DCONFIG_ID=1 -DREAL_CNN -DDEBUG_OUTPUT=1
                   -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
                   -std=gnu++17
                   -DESP_NN -DCONFIG_NN_OPTIMIZED -DARCH_ESP32_S3
                   -DBOARD_HAS_PSRAM
lib_deps         = nickjgniklu/ESP_TF@^2.0.1
build_src_filter = +<main.cpp>

; ─────────────────────────────────────────────────────────────
; arducam_test — bring up the ArduCAM Mini 2MP Plus with Arducam's
; official library (CPLD reset + full InitCAM). Builds ONLY
; src/arducam_test.cpp. Flash:  pio run -e arducam_test -t upload
; ─────────────────────────────────────────────────────────────
[env:arducam_test]
platform         = espressif32
board            = seeed_xiao_esp32s3
framework        = arduino
monitor_speed    = 115200
build_flags      = -DARDUCAM_TEST -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<main.cpp> -<hello.cpp>

; hello_test — USB-serial sanity check (no camera). Flash:
;   pio run -e hello_test -t upload
[env:hello_test]
platform         = espressif32
board            = seeed_xiao_esp32s3
framework        = arduino
monitor_speed    = 115200
build_flags      = -DHELLO_ONLY -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<hello.cpp>

