; =============================================================
; LoRa-E5 Mini — Platform C
; AMR Phase-Decomposed Energy Measurement
;
; 6-Phase cycle using LoRa instead of WiFi.
; Uses STM32WLE5JC (SX1262 built-in radio).
;
; Wiring (INA226 — reconnect to LoRa-E5 power rail):
;   INA226 VIN+ → USB VBUS
;   INA226 VIN- → LoRa-E5 5V header pin
;
; UART phase markers:
;   LoRa-E5 USART1 (PA9 = TX) → D1 Mini GPIO14 (D5)
;
; ArduCam Mega library:
;   Download from https://github.com/ArduCAM/Arducam_Mega
;   Place in lib/ folder
; =============================================================

[env:lora_e5]
platform      = ststm32
board         = nucleo_wl55jc    ; closest match for STM32WLE5JC
framework     = arduino
monitor_speed = 9600
; No USB on STM32WLE5 — Serial maps to hardware USART1 (PA9=TX, PA10=RX)
lib_deps      =
    jgromes/RadioLib @ ^6.6.0
    stm32duino/STM32duino Low Power @ ^1.2.1
    stm32duino/STM32duino RTC @ ^1.4.0
    ; Arducam_Mega is vendored in lib/Arducam_Mega (patched: Platform.h adds
    ; ARDUINO_ARCH_STM32 to the ArduinoHal branch so it links on STM32WLE5).

; ─────────────────────────────────────────────────────────────
; Strategy B (Paper 2): full-frame QVGA 320x240 capture + full JPEG
; payload (~37 LoRa packets at SF7). Flash with:  pio run -e lora_e5_stratB -t upload
; The default [env:lora_e5] builds Strategy C1 (modeled 160x40 ROI).
; ─────────────────────────────────────────────────────────────
[env:lora_e5_stratB]
extends     = env:lora_e5
build_flags = -DSTRATEGY_B

; Strategy C-OPTIMIZED: real hardware ROI (160x120 zoom-crop) + grayscale +
; JPEG compression + TX-to-EOI (padding strip). Measures the honest deployed
; byte count vs the default env:lora_e5 (modeled 160x40). Flash:
;   pio run -e lora_e5_stratC_opt -t upload
[env:lora_e5_stratC_opt]
extends     = env:lora_e5
build_flags = -DSTRATEGY_C_OPT

; Same, with CP2102 text output (COM9) to verify byte counts before a run.
[env:lora_e5_stratC_opt_debug]
extends     = env:lora_e5
build_flags = -DSTRATEGY_C_OPT -DDEBUG_SERIAL

; Strategy B with CP2102 text output for cycle verification (markers on PB6,
; short sleeps). NOT for the real measurement run. Flash:
;   pio run -e lora_e5_stratB_debug -t upload
[env:lora_e5_stratB_debug]
extends     = env:lora_e5
build_flags = -DSTRATEGY_B -DDEBUG_SERIAL

; ─────────────────────────────────────────────────────────────
; Mini 2MP bring-up probe (SPI + I2C check of the classic ArduCAM Mini).
; Builds ONLY src/mini_probe.cpp (main.cpp excluded). Flash:
;   pio run -e lora_e5_minitest -t upload
; ─────────────────────────────────────────────────────────────
[env:lora_e5_minitest]
extends          = env:lora_e5
build_flags      = -DMINI_PROBE
build_src_filter = +<*> -<main.cpp> -<loopback.cpp> -<cstest.cpp> -<arducam_e5_capture.cpp>

; Full-frame capture test on the E5 (ArduCAM lib). Flash:
;   pio run -e lora_e5_capture -t upload
[env:lora_e5_capture]
extends          = env:lora_e5
build_flags      = -DE5_CAPTURE
build_src_filter = +<arducam_e5_capture.cpp>

; Radio bring-up test (SX1262 init + TX). Flash:
;   pio run -e lora_e5_radiotest -t upload
[env:lora_e5_radiotest]
extends          = env:lora_e5
build_flags      = -DRADIO_TEST
build_src_filter = +<radiotest.cpp>

; Marker path isolation (PA9 -> logger D5). Flash:
;   pio run -e lora_e5_markertest -t upload
[env:lora_e5_markertest]
extends          = env:lora_e5
build_flags      = -DMARKER_TEST
build_src_filter = +<markertest.cpp>

; STOP2 sleep timing diagnostic (LSI). Flash:
;   pio run -e lora_e5_sleeptest -t upload
[env:lora_e5_sleeptest]
extends          = env:lora_e5
build_flags      = -DSLEEP_TEST
build_src_filter = +<sleeptest.cpp>

; Camera software power-gate test (ArduChip GPIO_PWREN). Flash:
;   pio run -e lora_e5_campwrtest -t upload
[env:lora_e5_campwrtest]
extends          = env:lora_e5
build_flags      = -DCAM_PWR_TEST
build_src_filter = +<campwrtest.cpp>

; STOP2 + radio timing diagnostic. Flash:
;   pio run -e lora_e5_sleeptest2 -t upload
[env:lora_e5_sleeptest2]
extends          = env:lora_e5
build_flags      = -DSLEEP_TEST2
build_src_filter = +<sleeptest2.cpp>

; STOP2 + radio TX/RX timing diagnostic. Flash:
;   pio run -e lora_e5_sleeptest3 -t upload
[env:lora_e5_sleeptest3]
extends          = env:lora_e5
build_flags      = -DSLEEP_TEST3
build_src_filter = +<sleeptest3.cpp>

; OV2640 real-windowing test (dumps 160x40 JPEG as hex). Flash:
;   pio run -e lora_e5_windowtest -t upload
[env:lora_e5_windowtest]
extends          = env:lora_e5
build_flags      = -DWINDOW_TEST
build_src_filter = +<windowtest.cpp>

; Capture-tuning byte-count test: grayscale + JPEG-compression sweep on QQVGA.
;   pio run -e lora_e5_captune -t upload
[env:lora_e5_captune]
extends          = env:lora_e5
build_flags      = -DCAPTUNE
build_src_filter = +<captunetest.cpp>

; STOP vs SLEEP: does LowPower.sleep() keep the radio alive? Flash:
;   pio run -e lora_e5_sleeptest4 -t upload
[env:lora_e5_sleeptest4]
extends          = env:lora_e5
build_flags      = -DSLEEP_TEST4
build_src_filter = +<sleeptest4.cpp>

; STOP2 + radio WARM-sleep (proper low-power sequence). Flash:
;   pio run -e lora_e5_sleeptest5 -t upload   (measure uA during "SLEEP>>")
[env:lora_e5_sleeptest5]
extends          = env:lora_e5
build_flags      = -DSLEEP_TEST5
build_src_filter = +<sleeptest5.cpp>

; STOP2 bisection: radio.begin + warm sleep, NO TX. Flash + POWER-CYCLE, then:
;   pio run -e lora_e5_sleeptest6 -t upload
[env:lora_e5_sleeptest6]
extends          = env:lora_e5
build_flags      = -DSLEEP_TEST6
build_src_filter = +<sleeptest6.cpp>

; STOP2 + radio + C2-power/IRQ fix candidates. Flash + POWER-CYCLE:
;   pio run -e lora_e5_sleeptest7 -t upload
[env:lora_e5_sleeptest7]
extends          = env:lora_e5
build_flags      = -DSLEEP_TEST7
build_src_filter = +<sleeptest7.cpp>

; Staged STOP2 bisection (bare -> +begin -> +TX -> +radio.sleep):
;   pio run -e lora_e5_sleeptest8 -t upload
[env:lora_e5_sleeptest9]
extends          = env:lora_e5
build_flags      = -DSLEEP_TEST9
build_src_filter = +<sleeptest9.cpp>

[env:lora_e5_sleeptest8]
extends          = env:lora_e5
build_flags      = -DSLEEP_TEST8
build_src_filter = +<sleeptest8.cpp>

; ─────────────────────────────────────────────────────────────
; MULTI-YEAR NODE = camera power-gate (PB9 -> FQP30N06L) + optimized
; capture (hw ROI + grayscale + QS + EOI-strip) + warm radio sleep + STOP2.
;   pio run -e lora_e5_node -t upload         (markers -> PA9, INA rig)
;   pio run -e lora_e5_node_debug -t upload   (text -> CP2102 COM9 @9600)
;   pio run -e lora_e5_gatetest -t upload     (MOSFET wiring check only)
; ─────────────────────────────────────────────────────────────
[env:lora_e5_node]
extends          = env:lora_e5
build_flags      = -DNODE_MULTIYEAR
build_src_filter = +<node_multiyear.cpp>

[env:lora_e5_node_debug]
extends          = env:lora_e5
build_flags      = -DNODE_MULTIYEAR -DDEBUG_SERIAL
build_src_filter = +<node_multiyear.cpp>

[env:lora_e5_gatetest]
extends          = env:lora_e5
build_flags      = -DNODE_MULTIYEAR -DGATE_TEST -DDEBUG_SERIAL
build_src_filter = +<node_multiyear.cpp>

; Strategy-B GATED variant: same gate+STOP2 node, but full-frame 320x240 color
; JPEG (no ROI/gray/QS). Compares B-gated vs the optimized node at equal power.
;   pio run -e lora_e5_node_B -t upload
[env:lora_e5_node_B]
extends          = env:lora_e5
build_flags      = -DNODE_MULTIYEAR -DFULLFRAME
build_src_filter = +<node_multiyear.cpp>

; CS drive test — toggles PA0 HIGH/LOW every 3s. Flash:
;   pio run -e lora_e5_cstest -t upload
[env:lora_e5_cstest]
extends          = env:lora_e5
build_flags      = -DCSTEST
build_src_filter = +<cstest.cpp>

; SPI2 loopback self-test (jumper PA10<->PB14). Flash:
;   pio run -e lora_e5_loopback -t upload
[env:lora_e5_loopback]
extends          = env:lora_e5
build_flags      = -DLOOPBACK
build_src_filter = +<loopback.cpp>
